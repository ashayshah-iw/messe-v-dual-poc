<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">GTM Frontend Architecture</text>
  <text x="700" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">Aligned to backend microservices via API Gateway</text>

  <!-- Backend -->
  <rect x="470" y="86" width="460" height="70" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="700" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">GTM Backend</text>
  <text x="700" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">API Gateway · JWT · Routing · Rate limit · CORS</text>

  <line x1="700" y1="156" x2="700" y2="186" stroke="#111111" stroke-width="1.5"/>
  <polygon points="700,194 694,182 706,182" fill="#111111"/>

  <!-- Frontend shell -->
  <rect x="430" y="196" width="540" height="56" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="700" y="231" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#111111">GTM Frontend — Next.js (Web / 2D)</text>

  <line x1="700" y1="252" x2="700" y2="280" stroke="#111111" stroke-width="1.5"/>
  <polygon points="700,288 694,276 706,276" fill="#111111"/>

  <!-- API client -->
  <rect x="470" y="290" width="460" height="64" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="700" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111111">API Client</text>
  <text x="700" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333333">Fetch / Axios · Auth headers · Service routes</text>

  <line x1="700" y1="354" x2="700" y2="382" stroke="#111111" stroke-width="1.5"/>
  <polygon points="700,390 694,378 706,378" fill="#111111"/>

  <!-- Auth -->
  <rect x="500" y="392" width="400" height="148" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="700" y="422" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111111">Auth</text>
  <text x="700" y="444" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555555">Auth and User Service</text>
  <text x="540" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111111">- Login / Register / Refresh / Logout</text>
  <text x="540" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111111">- Profile (Me) · Password reset</text>
  <text x="540" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111111">- Session gate for all modules below</text>

  <!-- Bus -->
  <line x1="700" y1="540" x2="700" y2="572" stroke="#111111" stroke-width="1.5"/>
  <line x1="100" y1="572" x2="1300" y2="572" stroke="#111111" stroke-width="1.5"/>
  <line x1="100" y1="572" x2="100" y2="598" stroke="#111111" stroke-width="1.5"/>
  <line x1="300" y1="572" x2="300" y2="598" stroke="#111111" stroke-width="1.5"/>
  <line x1="500" y1="572" x2="500" y2="598" stroke="#111111" stroke-width="1.5"/>
  <line x1="700" y1="572" x2="700" y2="598" stroke="#111111" stroke-width="1.5"/>
  <line x1="900" y1="572" x2="900" y2="598" stroke="#111111" stroke-width="1.5"/>
  <line x1="1100" y1="572" x2="1100" y2="598" stroke="#111111" stroke-width="1.5"/>
  <line x1="1300" y1="572" x2="1300" y2="598" stroke="#111111" stroke-width="1.5"/>
  <polygon points="100,606 94,594 106,594" fill="#111111"/>
  <polygon points="300,606 294,594 306,594" fill="#111111"/>
  <polygon points="500,606 494,594 506,594" fill="#111111"/>
  <polygon points="700,606 694,594 706,594" fill="#111111"/>
  <polygon points="900,606 894,594 906,594" fill="#111111"/>
  <polygon points="1100,606 1094,594 1106,594" fill="#111111"/>
  <polygon points="1300,606 1294,594 1306,594" fill="#111111"/>

  <!-- Exhibition -->
  <rect x="20" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="100" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Exhibition</text>
  <text x="100" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">Exhibition Mgmt</text>
  <text x="34" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Exhibition List</text>
  <text x="34" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Exhibition Details</text>
  <text x="34" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Link Exhibitors</text>
  <text x="34" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Browse / Search</text>

  <!-- Stall / Hall -->
  <rect x="220" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="300" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Stall / Hall</text>
  <text x="300" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">Stalls + 2D map</text>
  <text x="234" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Stall List / View</text>
  <text x="234" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Requests</text>
  <text x="234" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Assignment</text>
  <text x="234" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Zones / Aisles</text>
  <text x="234" y="786" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Hall presence</text>

  <!-- Exhibitor -->
  <rect x="420" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Exhibitor</text>
  <text x="500" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">Exhibitors</text>
  <text x="434" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Profile</text>
  <text x="434" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Members</text>
  <text x="434" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Contents</text>
  <text x="434" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Management</text>

  <!-- Chat -->
  <rect x="620" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="700" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Chat</text>
  <text x="700" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">Communication</text>
  <text x="634" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Conversations</text>
  <text x="634" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Messages</text>
  <text x="634" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Create / Delete</text>
  <text x="634" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Real-time UI</text>

  <!-- Meeting -->
  <rect x="820" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="900" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Meeting</text>
  <text x="900" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">Meeting Service</text>
  <text x="834" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Meetings CRUD</text>
  <text x="834" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Start / Complete</text>
  <text x="834" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Recordings</text>
  <text x="834" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Transcripts</text>
  <text x="834" y="786" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Reports</text>

  <!-- Notification -->
  <rect x="1020" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="1100" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Notification</text>
  <text x="1100" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">Notification Svc</text>
  <text x="1034" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Alerts list</text>
  <text x="1034" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Mark read</text>
  <text x="1034" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Read all</text>
  <text x="1034" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Badge / Inbox</text>

  <!-- Media -->
  <rect x="1220" y="610" width="160" height="250" rx="10" fill="#f0f0f0" stroke="#111111" stroke-width="1.5"/>
  <text x="1300" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#111111">Media</text>
  <text x="1300" y="660" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555555">File / Media Svc</text>
  <text x="1234" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Image upload</text>
  <text x="1234" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- PDF / Docs</text>
  <text x="1234" y="738" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Video upload</text>
  <text x="1234" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#111111">- Asset pickers</text>

  <text x="700" y="900" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555555">Auth is the entry module. Feature modules are siblings and map 1:1 to backend services.</text>
  <text x="700" y="924" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#777777">Exhibition · Stall · Exhibitor share Exhibition Management Service on the backend.</text>
  <text x="700" y="948" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#777777">Chat and Meeting are separate (Communication vs Meeting). Media maps to File / Media Service.</text>
</svg>
